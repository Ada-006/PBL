<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPrice India | Live Crop Rates</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-content">
            <div class="logo">
                <i class="fa-solid fa-leaf"></i>
                <span>Agri<span class="highlight">Price</span> India</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#">Market Trends</a>
                <button class="btn-govt">Govt Portal</button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>Real-Time <span class="highlight">Mandi Prices</span></h1>
            <p>Direct data from official government sources across India.</p>
            
            <div class="search-box">
                <input type="text" id="cropSearch" placeholder="Search crop (e.g. Wheat, Rice)...">
                <select id="stateFilter">
                    <option value="">All States</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Gujarat">Gujarat</option>
                </select>
                <button class="btn-search" onclick="fetchCropPrices()">
                    <i class="fa-solid fa-magnifying-glass"></i> Search
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="table-header">
            <h2>Latest Market Arrivals</h2>
            <p id="date-display"></p>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Crop Name</th>
                        <th>Market (Mandi)</th>
                        <th>State</th>
                        <th>Modal Price (₹/Quintal)</th>
                    </tr>
                </thead>
                <tbody id="price-table-body">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
